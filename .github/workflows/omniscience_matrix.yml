name: Project OMNISCIENCE 24/7 Universal YouTube Brain

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */4 * * *'

permissions:
  contents: write

jobs:
  dissect-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Omniscience Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML & Vision Stack
        run: |
          pip install --upgrade pip
          pip install requests numpy pillow xgboost scikit-learn google-api-python-client google-auth

      - name: Run 10-Layer YouTube Dissection & Incremental Training
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python omniscience_core.py

      - name: Commit Updated Synaptic Weights to Brain Vault
        run: |
          git config user.name "Omniscience Neural Core"
          git config user.email "core@omniscience.ai"
          git add brain/
          git diff --staged --quiet || git commit -m "brain(synapse): incremental 109-country & contrastive 0-view/viral weight update"
          git pull --rebase -X theirs origin main || true
          git push origin main
